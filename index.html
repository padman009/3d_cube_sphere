<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive 3D cube demo powered by Three.js">
    <meta name="color-scheme" content="dark light">
    <title>3D Cube Sphere</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <noscript>
        <div class="noscript">This demo requires JavaScript to run. Please enable JavaScript in your browser.</div>
    </noscript>

    <div id="hud" aria-live="polite" aria-label="Performance and controls">
        <div id="fps" class="chip" title="Frames per second">-- fps</div>
        <div id="cubeCount" class="chip" title="Number of cubes">Cubes: --</div>
        <div id="controls" class="panel" role="toolbar" aria-label="3D controls">
            <button id="toggle-anim" class="btn" type="button" aria-pressed="false">Pause</button>
            <label class="control">
                <span>Speed</span>
                <input id="speed" type="range" min="0" max="3" step="0.05" value="1" aria-label="Rotation speed">
            </label>
            <label class="control">
                <span>Radius</span>
                <input id="sphereRadius" type="range" min="2" max="24" step="1" value="10" aria-label="Sphere radius (in cubes)">
            </label>
            <label class="control">
                <input id="wireframe" type="checkbox" aria-label="Toggle wireframe">
                <span>Wireframe</span>
            </label>
            <label class="control">
                <span>Pixel ratio</span>
                <select id="pixelRatio" aria-label="Render pixel ratio">
                    <option value="auto" selected>Auto</option>
                    <option value="1">1x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>
                </select>
            </label>
            <button id="reset-camera" class="btn" type="button">Reset Camera</button>
            <button id="fullscreen" class="btn" type="button">Fullscreen</button>
        </div>
        <div id="hint" class="hint">Drag to rotate • Scroll to zoom • Double‑click to toggle fullscreen</div>
    </div>

    <script src="scripts/three.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
